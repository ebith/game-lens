[core]
avatar_url = "https://images-ext-1.discordapp.net/external/SfHNcPgzdvapQgglxxfodbDxqC3Z7bTNGdrfsb87FBE/%3Fv%3D1482477394/https/www.ddo.com/images/global/header/ddo-logo-small.png?format=webp&quality=lossless"
gemini_api_model = "gemini-3.5-flash-lite"
thinking_level = "medium"
loading_message = "翻訳処理中…"
system_instruction = "提供される画像は『Dungeons & Dragons Online』のスクリーンショットです。翻訳や解説の際はその設定を前提として考慮してください。指示に従い結果を必ず日本語で出力してください。なお、対象が本ゲーム内のものであることは自明であるため、出力文中に『Dungeons & Dragons Online』『DDO』『本作』『ゲーム内では』といったゲーム名やメタ的な前置き・言及を一切含めないでください。解説は世界観内の直接的な説明のみを簡潔に記述してください。"

[[actions]]
key = "g"
modifiers = ["ctrl", "alt", "shift"]
prompt = "画像中の黒い背景のダイアログの会話文を日本語に翻訳してください。上部の大文字が話者の名前、中央部の黄色い文字の文章が会話本文、下部の字下げされた段落の文章が返事の選択肢です。選択肢に含まれる`Close Window.`は出力不要です。"

[actions.response_schema]
type = "OBJECT"
required = ["speaker", "body_text", "player_options"]
[actions.response_schema.properties.speaker]
type = "STRING"
description = "話者の名前の英語原文"
[actions.response_schema.properties.body_text]
type = "ARRAY"
description = "会話本文の日本語翻訳"
[actions.response_schema.properties.body_text.items]
type = "STRING"
[actions.response_schema.properties.player_options]
type = "ARRAY"
description = "返事の選択肢の日本語翻訳"
[actions.response_schema.properties.player_options.items]
type = "STRING"

[[actions.discord_messages]]
username = "$speaker"
content_key = "body_text"

[[actions.discord_messages]]
username = "選択肢"
content_key = "player_options"
as_markdown_list = true


[[actions]]
key = "f"
modifiers = ["ctrl", "alt", "shift"]
prompt = "画像左下のチャット欄の文章を読み取ってください。「(Standard):」「(Dungeon Master):」「(Party):」等の先頭タグは絶対に翻訳せず保持し、タグのない折り返し行は上の行と結合した上で、メッセージ本文のみを日本語に翻訳して出力してください。"

[actions.response_schema]
type = "OBJECT"
required = ["lines"]
[actions.response_schema.properties.lines]
type = "ARRAY"
description = "ギルド・パーティのチャット、NPCのセリフ、システムアナウンスなどの抽出結果"
[actions.response_schema.properties.lines.items]
type = "STRING"
description = "「先頭のタグ(英語原文のまま) ＋ 日本語に翻訳された本文(折り返し行は結合)」の形式の文字列"

[[actions.discord_messages]]
username = "チャット欄"
content_key = "lines"

[[actions]]
key = "t"
modifiers = ["ctrl", "alt", "shift"]
prompt = """画像中のキャラクターやオブジェクトの上に表示されている名前を日本語訳してください。対象が複数いる場合はすべて抽出してください。可能ならどういった人・物・集団などであるのかの解説も付けてください。ペット・Hireling・プレイヤーキャラクター・ゲームタイトルに関しては出力不要です。
出力は以下の形式を対象ごとに繰り返し、行ごとに分割してリスト化してください。
・"## [名前の日本語訳]"
・"[解説文]"（複数行可）
・""（次の対象に移るための空行）
"""

[actions.response_schema]
type = "OBJECT"
required = ["text"]
[actions.response_schema.properties.text]
type = "ARRAY"
description = "Markdown形式の解説文（行ごとのリスト）"
[actions.response_schema.properties.text.items]
type = "STRING"

[[actions.discord_messages]]
username = "画面解説"
content_key = "text"

[[actions]]
key = "b"
modifiers = ["ctrl", "alt", "shift"]
prompt = """画像右上の小さなウインドウを元にクエスト名とクエストの目的を日本語訳してください。クエスト名はただカタカナにするのではなく意味を重視した翻訳にしてください。クエストの背景・導入・物語などの要約を添えてください。
出力は以下の形式で行ごとに分割してリスト化してください。
・"## [クエスト名]"
・"- [目的やオプション目的のリスト]"（複数行可）
・""（空行）
・"## あらすじ"
・"[あらすじの本文]"
"""

[actions.response_schema]
type = "OBJECT"
required = ["text"]
[actions.response_schema.properties.text]
type = "ARRAY"
description = "Markdown形式の解説文（行ごとのリスト）"
[actions.response_schema.properties.text.items]
type = "STRING"

[[actions.discord_messages]]
username = "クエスト情報"
content_key = "text"
